name: Uptime Backend

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      # `make test` builds libmina_signer.so from MinaProtocol/c-reference-signer
      # first, because the signature checks are CGo bindings onto that library.
      - name: Test
        run: make test
        working-directory: ./uptime-backend
      - name: Build Docker image
        run: docker build -t uptime-backend:latest .
        working-directory: ./uptime-backend
